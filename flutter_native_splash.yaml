flutter_native_splash:
  # 공통
  color: "#6366F1"
  android: true
  ios: true
  web: false

  # iOS 전용
  image_ios: assets/logos/doitdoit_splash_logo.png
  ios_content_mode: scaleAspectFit

  # Android 11 이하
  image_android: assets/logos/doitdoit_splash_logo.png
  android_gravity: center

  # Android 12 이상
  android_12:
    image: assets/logos/doitdoit_splash_logo.png
    color: "#6366F1"
    android_gravity: center